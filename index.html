<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RD One</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-title" content="RD One">
<meta name="theme-color" content="#103a36">
<style>
  html,body{height:100%;margin:0}
  body{background:#103a36;color:#e9ece9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;box-sizing:border-box}
  img{width:168px;height:168px;border-radius:28px}
  p{font-size:17px;line-height:1.5;max-width:360px;margin:20px 0 0}
  a{display:inline-block;margin-top:24px;padding:14px 28px;border:1px solid #c9cfcb;border-radius:999px;color:#fff;text-decoration:none;font-size:17px}
  #instalar{display:none}
</style>
</head>
<body>
<img src="icone-512.png" alt="RD One Imob">
<div id="abrindo"><p>Abrindo o Painel RD One…</p></div>
<div id="instalar">
  <p><b>Para colocar o ícone no celular:</b><br>toque em Compartilhar e depois em “Adicionar à Tela de Início”.</p>
</div>
<a id="link" href="https://script.google.com/a/macros/rdoneimob.com.br/s/AKfycbwzvrcKyHj8CQoLb674GuvDfEaqioyBRPyp0qB-idyMAdGTVRMLdMZO675CSEGByiypBg/exec">Abrir o Painel</a>
<script>
  // Página parada: só leva para o Painel. Com #instalar no fim do endereço ela fica
  // aberta para o ícone ser salvo na tela do celular (o endereço salvo é o sem #instalar).
  var destino = document.getElementById('link').href;
  if (location.hash === '#instalar') {
    document.getElementById('abrindo').style.display = 'none';
    document.getElementById('instalar').style.display = 'block';
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  } else {
    location.replace(destino);
  }
</script>
</body>
</html>
